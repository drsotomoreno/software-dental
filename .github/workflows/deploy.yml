# Despliegue: build de Vite en GitHub Actions (RAM abundante) + sync a EC2.
# NO toca clinical-sync.json ni .bak-* en el servidor.
name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2-main-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build dist on GHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html
          grep -o 'assets/index-[^"]*' dist/index.html || true

      - name: Multi-tenant sync guards
        run: |
          set -euo pipefail
          node --test \
            server/services/clinicalSyncStore.slimPull.test.js \
            shared/clinicalListBucket.test.js \
            src/services/clinicLocalIsolation.test.js \
            src/services/clinicalSyncHealth.guard.test.js

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhd-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Sync to EC2 + PM2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: mhd-dist
          path: dist

      - name: Pack dist
        run: |
          set -euo pipefail
          tar -czf dist.tgz -C dist .
          ls -lh dist.tgz

      - name: SCP dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist.tgz
          target: /tmp/
          overwrite: true

      - name: Apply on EC2 (no vite, no touch clinical-sync)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            CANONICAL="/var/www/mihistoriadental"
            APP_DIR="/home/ubuntu/software-dental"
            [[ -f "$APP_DIR/server.js" ]] || APP_DIR="$CANONICAL"

            # Snapshot tamaños sync (solo lectura; no modificar)
            SYNC="$APP_DIR/server/data/clinical-sync.json"
            if [[ -f "$SYNC" ]]; then
              echo "SYNC_BYTES_BEFORE=$(stat -c%s "$SYNC")"
              for bak in "$SYNC.bak-20261112" "$SYNC.bak-20261113-pre-merge" "$SYNC.bak-20261113-dedup"; do
                [[ -f "$bak" ]] && echo "PROTECTED $(basename "$bak")=$(stat -c%s "$bak")"
              done
            fi

            # Código servidor desde origin/main (sin build)
            if [[ -d "$CANONICAL/.git" ]]; then
              cd "$CANONICAL"
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/*.sh 2>/dev/null || true
              # Dependencias de producción si faltan (sin vite build)
              npm install --omit=dev || npm install || true
            fi
            if [[ "$APP_DIR" != "$CANONICAL" ]]; then
              rsync -a \
                --exclude 'server/data/' \
                --exclude '.env' \
                --exclude 'node_modules/' \
                --exclude '.git/' \
                --exclude 'dist/' \
                "$CANONICAL/" "$APP_DIR/" || true
              # PM2 usa APP_DIR. node_modules no viaja en el rsync, así que
              # una dependencia nueva (p. ej. bcryptjs) debe instalarse aquí.
              npm install --omit=dev --prefix "$APP_DIR" || npm install --prefix "$APP_DIR"
            fi

            # Extraer dist construido en GHA
            test -f /tmp/dist.tgz || { echo "MISSING_DIST_TGZ"; exit 1; }
            for target in "$CANONICAL/dist" "$APP_DIR/dist"; do
              sudo mkdir -p "$target"
              sudo tar -xzf /tmp/dist.tgz -C "$target"
              sudo chown -R "$(whoami):$(whoami)" "$target"
              sudo chmod -R a+rX "$target"
              test -f "$target/index.html"
            done
            rm -f /tmp/dist.tgz
            echo "DIST_BUNDLE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+' "$CANONICAL/dist/index.html" | head -1 || true)"

            # Nginx SPA: permisos www-data
            if [[ -f "$CANONICAL/scripts/configure-nginx-spa-static.sh" ]]; then
              PORT=3000
              [[ -f "$APP_DIR/.env" ]] && PORT="$(grep -E '^PORT=' "$APP_DIR/.env" | head -1 | cut -d= -f2- | tr -d \"\' || echo 3000)"
              PORT="${PORT:-3000}"
              bash "$CANONICAL/scripts/configure-nginx-spa-static.sh" "$CANONICAL/dist" "$PORT" || true
            fi
            sudo nginx -t && sudo systemctl reload nginx || true

            # Heap = 70% RAM [512,1536]. ecosystem.config.cjs usa la misma fórmula.
            # Nunca fijar 450 (OOM) ni 4096 (mata t3.micro).
            HEAP_MB=700
            if [[ -f "$APP_DIR/scripts/pm2-heap-from-ram.sh" ]]; then
              HEAP_MB="$(bash "$APP_DIR/scripts/pm2-heap-from-ram.sh")"
            fi
            set -a
            # shellcheck disable=SC1091
            [[ -f "$APP_DIR/.env" ]] && . "$APP_DIR/.env"
            set +a
            export NODE_ENV=production
            export NODE_OPTIONS="--max-old-space-size=${HEAP_MB}"
            [[ -n "${DATABASE_URL:-}" ]] || { echo "DATABASE_URL_EMPTY"; exit 1; }
            echo "HEAP_MB=$HEAP_MB"

            cd "$APP_DIR"
            # Índice liviano para GET /api/sync/pull?full=0 (evita OOM al parsear ~83MB).
            # Obligatorio: sin meta el pull slim responde SYNC_META_MISSING (no fallback OOM).
            # No modifica clinical-sync.json ni .bak-*.
            if [[ -f "$APP_DIR/server/data/clinical-sync.json" && -f "$APP_DIR/scripts/build-clinical-sync-meta.cjs" ]]; then
              echo "Building clinical-sync-meta.json (patients+appointments only)..."
              node --max-old-space-size=1536 "$APP_DIR/scripts/build-clinical-sync-meta.cjs"
              test -f "$APP_DIR/server/data/clinical-sync-meta.json"
              ls -lh "$APP_DIR/server/data/clinical-sync-meta.json"
            else
              echo "FATAL: falta clinical-sync.json o build-clinical-sync-meta.cjs"
              exit 1
            fi

            pm2 delete software-dental 2>/dev/null || true
            if [[ -f "$APP_DIR/ecosystem.config.cjs" ]]; then
              pm2 start "$APP_DIR/ecosystem.config.cjs" --update-env
            else
              pm2 start "$APP_DIR/server.js" \
                --name software-dental \
                --cwd "$APP_DIR" \
                --update-env \
                --node-args="--max-old-space-size=${HEAP_MB}"
            fi
            pm2 save
            sleep 18

            STATUS=$(pm2 jlist | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{const a=JSON.parse(r||"[]").find(x=>x.name==="software-dental");console.log(a&&a.pm2_env?a.pm2_env.status:"missing")})')
            echo "PM2_STATUS=$STATUS"
            [[ "$STATUS" == "online" ]] || { pm2 logs --lines 50 --err --nostream; exit 1; }

            # Sync intacto
            if [[ -f "$SYNC" ]]; then
              echo "SYNC_BYTES_AFTER=$(stat -c%s "$SYNC")"
            fi

            HEAD=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 12 -Ik "https://www.mihistoriadental.com/pacientes-valorados" || echo 000)
            echo "PUBLIC_HEAD_/pacientes-valorados=$HEAD"
            [[ "$HEAD" == "200" ]] || exit 1
            PUB=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 12 "https://www.mihistoriadental.com/pacientes" || echo 000)
            echo "PUBLIC_/pacientes=$PUB"
            [[ "$PUB" == "200" ]] || exit 1

            # Smoke multi-tenant: login + pull slim 200 (evita UI vacía con datos en disco).
            PORT="${PORT:-3000}"
            [[ -f "$APP_DIR/.env" ]] && PORT="$(grep -E '^PORT=' "$APP_DIR/.env" | head -1 | cut -d= -f2- | tr -d \"\' || echo "${PORT}")"
            PORT="${PORT:-3000}"
            test -f "$APP_DIR/scripts/smoke-clinical-sync-pull.cjs"
            SMOKE_REQUIRE_PATIENTS=1 PUBLIC_BASE_URL="http://127.0.0.1:${PORT}" \
              node "$APP_DIR/scripts/smoke-clinical-sync-pull.cjs"

            pm2 status
            free -m
            echo "Despliegue OK."
