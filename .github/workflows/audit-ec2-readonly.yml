# Auditoría READ-ONLY en EC2 (clinical-sync.json + PostgreSQL).
# No modifica datos. Disparo manual: workflow_dispatch.
name: Audit EC2 readonly patients

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only clinicId / patients audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH readonly audit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            CANONICAL="/var/www/mihistoriadental"
            SYNC_JSON="$CANONICAL/server/data/clinical-sync.json"

            echo "==== HOST / TIME ===="
            hostname
            date -u
            echo "CANONICAL=$CANONICAL"

            echo "==== clinical-sync.json existence ===="
            if [[ ! -f "$SYNC_JSON" ]]; then
              echo "MISSING_SYNC_JSON=$SYNC_JSON"
              echo "PM2_CWDS:"
              pm2 jlist | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{for(const a of JSON.parse(r||"[]")){const e=a.pm2_env||{};console.log([a.name,e.status,e.pm_cwd||""].join(" | "))}})' || true
              # try discover clinical-sync.json under pm2 cwds
              pm2 jlist | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{const apps=JSON.parse(r||"[]");for(const a of apps){const cwd=(a.pm2_env||{}).pm_cwd;if(cwd)console.log(cwd)}})' | while read -r cwd; do
                [[ -n "$cwd" ]] || continue
                if [[ -f "$cwd/server/data/clinical-sync.json" ]]; then
                  echo "FOUND_SYNC=$cwd/server/data/clinical-sync.json"
                fi
              done
            else
              echo "FOUND_SYNC=$SYNC_JSON"
            fi

            echo "==== JSON clinic keys + entity counts ===="
            node <<'NODE'
            const fs = require('fs')
            const path = require('path')
            const candidates = [
              '/var/www/mihistoriadental/server/data/clinical-sync.json',
            ]
            try {
              const raw = require('child_process').execSync(
                "pm2 jlist",
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] },
              )
              for (const a of JSON.parse(raw || '[]')) {
                const cwd = a?.pm2_env?.pm_cwd
                if (cwd) candidates.push(path.join(cwd, 'server/data/clinical-sync.json'))
              }
            } catch {}
            const file = candidates.find((p) => fs.existsSync(p))
            if (!file) {
              console.log(JSON.stringify({ error: 'clinical-sync.json not found', candidates }, null, 2))
              process.exit(0)
            }
            const j = JSON.parse(fs.readFileSync(file, 'utf8'))
            const clinics = j.clinics || {}
            const rows = Object.entries(clinics).map(([k, c]) => ({
              clinicKey: k,
              patients: Object.keys(c.patients || {}).length,
              clinicalRecords: Object.keys(c.clinicalRecords || {}).length,
              odontograms: Object.keys(c.odontograms || {}).length,
              appointments: Object.keys(c.appointments || {}).length,
              diagnosticAids: Object.keys(c.diagnosticAids || {}).length,
              drafts: Object.keys(c.drafts || {}).length,
              attachments: Object.keys(c.attachments || {}).length,
            }))
            rows.sort((a, b) => b.patients - a.patients || a.clinicKey.localeCompare(b.clinicKey))
            const masterKeys = rows.filter((r) =>
              /doctormauricio|superadmin|2aae9ec2-4e41-4ea2-b932-0a6642894591/i.test(r.clinicKey),
            )
            const sampleMaster =
              clinics['clinic:doctormauriciosoto@gmail.com'] ||
              clinics['doctormauriciosoto@gmail.com'] ||
              clinics['superadmin-session'] ||
              null
            const masterPatients = sampleMaster
              ? Object.values(sampleMaster.patients || {}).map((r) => ({
                  syncId: r.syncId,
                  doc: r.payload?.documentNumber || '',
                  name: `${r.payload?.firstName || ''} ${r.payload?.lastName || ''}`.trim(),
                  clinicId: r.clinicId || r.payload?.clinicId || '',
                }))
              : []
            console.log(
              JSON.stringify(
                {
                  syncFile: file,
                  clinicCount: rows.length,
                  clinics: rows,
                  masterRelated: masterKeys,
                  masterPatientsSample: masterPatients,
                },
                null,
                2,
              ),
            )
            NODE

            echo "==== Locate .env / DATABASE_URL (read-only) ===="
            ENV_CANDIDATES=(
              "$CANONICAL/.env"
              "$CANONICAL/server/.env"
              "/home/ubuntu/mihistoriadental/.env"
              "/home/ec2-user/mihistoriadental/.env"
            )
            pm2 jlist 2>/dev/null | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{for(const a of JSON.parse(r||"[]")){const cwd=(a.pm2_env||{}).pm_cwd; if(cwd){console.log(cwd+"/.env"); console.log(cwd+"/server/.env");}}})' | while read -r p; do
              ENV_CANDIDATES+=("$p")
            done || true

            ENV_FILE=""
            for p in "${ENV_CANDIDATES[@]}"; do
              if [[ -f "$p" ]]; then
                echo "FOUND_ENV=$p"
                ENV_FILE="$p"
                break
              else
                echo "MISS_ENV=$p"
              fi
            done

            echo "==== PostgreSQL pacientes by clinica_id ===="
            if [[ -z "$ENV_FILE" ]]; then
              echo "MISSING_ENV_ALL_CANDIDATES"
              # still try pm2 env
              pm2 jlist 2>/dev/null | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{for(const a of JSON.parse(r||"[]")){const e=a.pm2_env||{}; if(e.DATABASE_URL){console.log("PM2_HAS_DATABASE_URL name="+a.name);}}})' || true
              echo "==== DONE READONLY ===="
              exit 0
            fi

            DATABASE_URL=$(grep -E '^DATABASE_URL=' "$ENV_FILE" | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
            if [[ -z "${DATABASE_URL:-}" ]]; then
              echo "EMPTY_DATABASE_URL in $ENV_FILE"
              echo "==== DONE READONLY ===="
              exit 0
            fi
            echo "DATABASE_URL_PRESENT=yes"
            export ENV_FILE
            node - <<'NODE'
            const fs = require('fs')
            let Client
            try {
              Client = require('pg').Client
            } catch (e1) {
              try {
                Client = require('/var/www/mihistoriadental/node_modules/pg').Client
              } catch (e2) {
                console.error('PG_MODULE_MISSING', e2.message)
                process.exit(0)
              }
            }
            const envFile = process.env.ENV_FILE
            const envLine = fs
              .readFileSync(envFile, 'utf8')
              .split(/\r?\n/)
              .find((l) => l.startsWith('DATABASE_URL='))
            const url = envLine
              ? envLine.slice('DATABASE_URL='.length).replace(/^["']|["']$/g, '')
              : ''
            ;(async () => {
              const client = new Client({ connectionString: url })
              await client.connect()
              const byClinic = await client.query(
                'SELECT c.id::text AS clinica_id, COALESCE(c.nombre, chr(32)) AS nombre, COUNT(p.*) FILTER (WHERE p.deleted_at IS NULL) AS vivos, COUNT(p.*) FILTER (WHERE p.deleted_at IS NOT NULL) AS borrados FROM clinicas c LEFT JOIN pacientes p ON p.clinica_id = c.id GROUP BY c.id, c.nombre ORDER BY vivos DESC LIMIT 100',
              )
              console.log('PG_BY_CLINICA', JSON.stringify(byClinic.rows, null, 2))
              const totals = await client.query(
                'SELECT COUNT(*) FILTER (WHERE deleted_at IS NULL) AS vivos, COUNT(*) FILTER (WHERE deleted_at IS NOT NULL) AS borrados FROM pacientes',
              )
              console.log('PG_TOTALS', JSON.stringify(totals.rows[0], null, 2))
              const sample = await client.query(
                'SELECT id::text, clinica_id::text, tipo_documento, numero_documento, nombres, apellidos, deleted_at, updated_at FROM pacientes WHERE deleted_at IS NULL ORDER BY updated_at DESC NULLS LAST LIMIT 40',
              )
              console.log('PG_RECENT_VIVOS', JSON.stringify(sample.rows, null, 2))
              await client.end()
            })().catch((err) => {
              console.error('PG_ERROR', err.message)
              process.exit(0)
            })
            NODE

            echo "==== DONE READONLY ===="
