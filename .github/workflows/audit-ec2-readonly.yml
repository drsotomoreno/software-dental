# Auditoría READ-ONLY en EC2. No escribe ni sobrescribe datos clínicos.
name: Audit EC2 readonly patients

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only clinicId / patients audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SSH readonly audit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "==== HOST / TIME ===="
            hostname
            date -u

            echo "==== Locate clinical-sync.json ===="
            SYNC_FILE=""
            for cand in \
              /var/www/mihistoriadental/server/data/clinical-sync.json \
              /home/ubuntu/software-dental/server/data/clinical-sync.json \
              /home/ec2-user/software-dental/server/data/clinical-sync.json
            do
              if [[ -f "$cand" ]]; then
                echo "CANDIDATE_SYNC=$cand"
                SYNC_FILE="$cand"
              fi
            done
            pm2 jlist 2>/dev/null | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{for(const a of JSON.parse(r||"[]")){const cwd=(a.pm2_env||{}).pm_cwd; if(cwd) console.log(cwd+"/server/data/clinical-sync.json")}})' | while read -r p; do
              if [[ -f "$p" ]]; then
                echo "PM2_SYNC=$p"
                # prefer pm2 cwd if present
                echo "$p" > /tmp/mhd_sync_path.txt
              fi
            done || true
            if [[ -f /tmp/mhd_sync_path.txt ]]; then
              SYNC_FILE=$(cat /tmp/mhd_sync_path.txt)
            fi
            echo "SYNC_FILE=${SYNC_FILE:-MISSING}"

            echo "==== SAMPLE RECORDS from clinic:doctormauriciosoto@gmail.com ===="
            SYNC_FILE="$SYNC_FILE" node <<'NODE'
            const fs = require('fs')
            const syncFile = process.env.SYNC_FILE
            if (!syncFile || !fs.existsSync(syncFile)) {
              console.log(JSON.stringify({ error: 'sync missing', syncFile }))
              process.exit(0)
            }
            const j = JSON.parse(fs.readFileSync(syncFile, 'utf8'))
            const clinic = j.clinics?.['clinic:doctormauriciosoto@gmail.com']
            if (!clinic) {
              console.log(JSON.stringify({ error: 'canonical clinic missing', keys: Object.keys(j.clinics || {}) }))
              process.exit(0)
            }
            const patients = Object.values(clinic.patients || {})
            const odontograms = Object.values(clinic.odontograms || {})
            const drafts = Object.values(clinic.drafts || {})
            const diagnosticAids = Object.values(clinic.diagnosticAids || {})
            const attachments = Object.values(clinic.attachments || {})
            const syncQueue = Object.values(clinic.sync_queue || {})

            function pickMeta(rec) {
              const p = rec?.payload && typeof rec.payload === 'object' ? rec.payload : {}
              return {
                syncId: rec.syncId || null,
                clinicId: rec.clinicId || null,
                updatedAt: rec.updatedAt || null,
                serverUpdatedAt: rec.serverUpdatedAt || null,
                deletedAt: rec.deletedAt ?? null,
                status: p.status ?? rec.status ?? null,
                valuationOnly: p.valuationOnly ?? null,
                treatmentCompleted: p.treatmentCompleted ?? null,
                phase: p.phase ?? null,
                documentNumber: p.documentNumber ? '[redacted]' : null,
                firstName: p.firstName ? '[redacted]' : null,
                lastName: p.lastName ? '[redacted]' : null,
                patientSyncId: p.patientSyncId || null,
                patientId: p.patientId || null,
                entityHint: p.entityType || p.fileHash || p.aidId || null,
                payloadKeys: Object.keys(p).sort(),
              }
            }

            // Prefer pacientes with both valuation flags visible
            const samplePatients = patients.slice(0, 2)
            const sampleOdonto = odontograms[0] || null
            const sampleDraft = drafts[0] || null

            const targetAidIds = [
              '9d1b7344-77a1-4f0a-9468-92e066a95aca',
              '19c082ac-dd0a-415e-bd57-2b5b70977535',
              '64e43d1f-5775-451c-bb94-d8d19eabdf13',
              '727d194c-515f-4023-9bd0-6a6430fa5979',
            ]
            const targetHashes = [
              'ecb84db684efeaf8fe5d08a9e425c6693a995338d4ab5d3e8b41a1d9b3ea6f82',
              'f35d55ad49f0d7c3ee9b0f7580f54a756a1a49b589c83dcc1e41476c96a4077d',
              '138bc3768aa59309306f1dfd6b002ad86f7aa1d35fc2a6dc0cda2825e00b19ce',
            ]
            function matchesAid(rec) {
              const p = rec?.payload || {}
              const id = String(rec.syncId || p.id || p.aidId || '')
              const hash = String(p.fileHash || '')
              return targetAidIds.includes(id) || targetAidIds.includes(String(p.aidId || '')) || targetHashes.includes(hash)
            }

            let activos = 0, valoradosStrict = 0, valoradosPhase = 0, valoradosCombined = 0, terminados = 0
            const clinicIdCounts = {}
            const phaseCounts = {}
            const valuationOnlyCounts = {}
            const statusCounts = {}
            for (const rec of patients) {
              const p = rec.payload || {}
              const phase = String(p.phase ?? '(null)')
              const vo = p.valuationOnly === true ? 'true' : p.valuationOnly === false ? 'false' : String(p.valuationOnly ?? '(null)')
              const st = p.status == null ? '(null)' : String(p.status)
              phaseCounts[phase] = (phaseCounts[phase] || 0) + 1
              valuationOnlyCounts[vo] = (valuationOnlyCounts[vo] || 0) + 1
              statusCounts[st] = (statusCounts[st] || 0) + 1
              const isStrict = p.valuationOnly === true
              const isPhase = p.phase === 'VALORACION_RAPIDA'
              const isCombined = isStrict || isPhase
              if (isStrict) valoradosStrict++
              if (isPhase) valoradosPhase++
              if (isCombined) {
                valoradosCombined++
                const cid = String(rec.clinicId || p.clinicId || '(empty)')
                clinicIdCounts[cid] = (clinicIdCounts[cid] || 0) + 1
              }
              if (p.treatmentCompleted === true) terminados++
              else if (!isCombined) activos++
            }

            console.log('SAMPLE_AUDIT_JSON_BEGIN')
            console.log(JSON.stringify({
              syncFile,
              canonicalCounts: {
                patients: patients.length,
                odontograms: odontograms.length,
                drafts: drafts.length,
                diagnosticAids: diagnosticAids.length,
                attachments: attachments.length,
                sync_queue: syncQueue.length,
                activos,
                valorados: valoradosStrict,
                valoradosStrict,
                valoradosPhase,
                valoradosCombined,
                terminados,
                phaseCounts,
                valuationOnlyCounts,
                statusCounts,
                valoradosClinicIdCounts: clinicIdCounts,
              },
              samplePatients: samplePatients.map(pickMeta),
              sampleOdontogram: sampleOdonto ? pickMeta(sampleOdonto) : null,
              sampleDraft: sampleDraft ? pickMeta(sampleDraft) : null,
              syncQueueLocalCrosscheck: {
                matchedInDiagnosticAids: diagnosticAids.filter(matchesAid).map(pickMeta),
                matchedInAttachments: attachments.filter(matchesAid).map(pickMeta),
                matchedInSyncQueueBucket: syncQueue.filter(matchesAid).map(pickMeta),
              },
            }, null, 2))
            console.log('SAMPLE_AUDIT_JSON_END')
            NODE

            echo "==== PM2 env DATABASE_URL + Postgres counts ===="
            set +e
            PM2_JSON=$(pm2 jlist 2>/dev/null)
            PM2_RC=$?
            set -e
            if [[ $PM2_RC -ne 0 || -z "$PM2_JSON" ]]; then
              echo "PM2_JLIST_FAILED rc=$PM2_RC"
            else
              printf '%s' "$PM2_JSON" > /tmp/mhd_pm2.json
              node -e '
                const fs = require("fs");
                const apps = JSON.parse(fs.readFileSync("/tmp/mhd_pm2.json","utf8"));
                let databaseUrl = "";
                const report = [];
                for (const app of apps) {
                  const env = app.pm2_env || {};
                  const has = Boolean(env.DATABASE_URL);
                  report.push({ name: app.name, status: env.status, cwd: env.pm_cwd || null, hasDatabaseUrl: has });
                  if (has && !databaseUrl) databaseUrl = String(env.DATABASE_URL);
                }
                console.log("PM2_APPS", JSON.stringify(report, null, 2));
                if (!databaseUrl) {
                  console.log("PM2_DATABASE_URL_MISSING");
                  process.exit(0);
                }
                console.log("PM2_DATABASE_URL_PRESENT=yes");
                fs.writeFileSync("/tmp/mhd_database_url.txt", databaseUrl);
                const cwd = (report.find((r) => r.cwd) || {}).cwd || "/var/www/mihistoriadental";
                fs.writeFileSync("/tmp/mhd_app_cwd.txt", cwd);
              '
              if [[ -f /tmp/mhd_database_url.txt ]]; then
                export DATABASE_URL="$(cat /tmp/mhd_database_url.txt)"
                APP_CWD="$(cat /tmp/mhd_app_cwd.txt 2>/dev/null || echo /var/www/mihistoriadental)"
                node -e '
                  let Client;
                  try { Client = require("pg").Client; }
                  catch (e1) {
                    try { Client = require(require("fs").readFileSync("/tmp/mhd_app_cwd.txt","utf8").trim() + "/node_modules/pg").Client; }
                    catch (e2) { console.log("PG_MODULE_MISSING", e2.message); process.exit(0); }
                  }
                  const client = new Client({ connectionString: process.env.DATABASE_URL });
                  (async () => {
                    await client.connect();
                    const tables = await client.query("SELECT table_name FROM information_schema.tables WHERE table_schema='"'"'public'"'"' AND table_name IN ('"'"'pacientes'"'"','"'"'patients'"'"','"'"'clinicas'"'"') ORDER BY table_name");
                    console.log("PG_TABLES", JSON.stringify(tables.rows, null, 2));
                    const names = tables.rows.map(r => r.table_name);
                    if (names.includes("pacientes")) {
                      const by = await client.query("SELECT clinica_id::text AS clinic_id, COUNT(*) FILTER (WHERE deleted_at IS NULL) AS vivos, COUNT(*) FILTER (WHERE deleted_at IS NOT NULL) AS borrados FROM pacientes GROUP BY 1 ORDER BY vivos DESC LIMIT 50");
                      console.log("PG_PACIENTES_BY_CLINICA", JSON.stringify(by.rows, null, 2));
                    }
                    if (names.includes("patients")) {
                      const cols = await client.query("SELECT column_name FROM information_schema.columns WHERE table_name='"'"'patients'"'"' ORDER BY ordinal_position");
                      console.log("PG_PATIENTS_COLUMNS", JSON.stringify(cols.rows.map(r=>r.column_name), null, 2));
                      const colNames = cols.rows.map(r => r.column_name);
                      const clinicCol = colNames.includes("clinic_id") ? "clinic_id" : (colNames.includes("clinica_id") ? "clinica_id" : null);
                      if (clinicCol) {
                        const by = await client.query("SELECT " + clinicCol + "::text AS clinic_id, COUNT(*) AS n FROM patients GROUP BY 1 ORDER BY n DESC LIMIT 50");
                        console.log("PG_PATIENTS_BY_CLINIC", JSON.stringify(by.rows, null, 2));
                      }
                    }
                    await client.end();
                  })().catch((err) => { console.log("PG_ERROR", err.message); process.exit(0); });
                '
              fi
            fi

            echo "==== DEEP valorados ACTIVE vs BAK (readonly) ===="
            DEEP_SCRIPT=""
            for cand in \
              /home/ubuntu/software-dental/scripts/audit-valorados-deep-readonly.cjs \
              /var/www/mihistoriadental/scripts/audit-valorados-deep-readonly.cjs
            do
              if [[ -f "$cand" ]]; then DEEP_SCRIPT="$cand"; break; fi
            done
            if [[ -z "$DEEP_SCRIPT" ]]; then
              curl -fsSL "https://raw.githubusercontent.com/drsotomoreno/software-dental/main/scripts/audit-valorados-deep-readonly.cjs" \
                -o /tmp/audit-valorados-deep-readonly.cjs \
                || curl -fsSL "https://cdn.jsdelivr.net/gh/drsotomoreno/software-dental@main/scripts/audit-valorados-deep-readonly.cjs" \
                -o /tmp/audit-valorados-deep-readonly.cjs
              DEEP_SCRIPT=/tmp/audit-valorados-deep-readonly.cjs
            fi
            echo "DEEP_SCRIPT=$DEEP_SCRIPT SYNC_FILE=$SYNC_FILE"
            wc -c "$DEEP_SCRIPT" "$SYNC_FILE" "${SYNC_FILE}.bak-20261112" 2>/dev/null || true
            node --max-old-space-size=4096 "$DEEP_SCRIPT" "$SYNC_FILE" 2>&1 || echo "DEEP_AUDIT_FAILED"

            echo "==== DONE READONLY ===="
