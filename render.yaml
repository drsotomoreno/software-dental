# Blueprint de Render. DATABASE_URL se edita en el dashboard (sync: false)
# para no dejar la contraseña en el repo ni bloquear la variable.
services:
  - type: web
    name: software-dental
    runtime: node
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # production usa el host oficial del MUV. MINSALUD_SANDBOX=false también.
      # MINSALUD_API_BASE_URL, si se define en el dashboard, reemplaza ese host.
      - key: MINSALUD_ENV
        value: production
      # Usuario, clave y NIT del prestador ya viven en el dashboard.
      - key: MINSALUD_USERNAME
        sync: false
      - key: MINSALUD_PASSWORD
        sync: false
      - key: MINSALUD_NIT
        sync: false
