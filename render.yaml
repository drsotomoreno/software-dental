# Blueprint de Render. DATABASE_URL se edita en el dashboard (sync: false)
# para no dejar la contraseña en el repo ni bloquear la variable.
services:
  - type: web
    name: software-dental
    runtime: node
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Documento real del paciente. false apunta a fevrips.sispro.gov.co.
      - key: MINSALUD_ENV
        value: production
      - key: MINSALUD_SANDBOX
        value: "false"
      # Usuario, clave y NIT del prestador se cargan en el dashboard. No van en el repo.
      - key: MINSALUD_USERNAME
        sync: false
      - key: MINSALUD_PASSWORD
        sync: false
      - key: MINSALUD_NIT
        sync: false
