# Blueprint de Render. DATABASE_URL se edita en el dashboard (sync: false)
# para no dejar la contraseña en el repo ni bloquear la variable.
services:
  - type: web
    name: software-dental
    runtime: node
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
