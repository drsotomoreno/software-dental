# Blueprint de Render. DATABASE_URL se edita en el dashboard (sync: false)
# para no dejar la contraseña en el repo ni bloquear la variable.
services:
  - type: web
    name: software-dental
    runtime: node
    buildCommand: npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Documento real y host oficial del MUV (fevrips.sispro.gov.co, versión 1.4.11).
      - key: MINSALUD_ENV
        value: production
      # Usuario, clave y NIT del prestador ya viven en el dashboard.
      - key: MINSALUD_USERNAME
        sync: false
      - key: MINSALUD_PASSWORD
        sync: false
      - key: MINSALUD_NIT
        sync: false
