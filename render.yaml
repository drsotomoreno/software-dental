# Blueprint de Render. DATABASE_URL se gestiona en el dashboard (sync: false)
# para que la casilla no quede bloqueada ni la contraseña viva en el repo.
services:
  - type: web
    name: software-dental
    runtime: node
    buildCommand: npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
